<main>
  <app-quadro-tarefas
    titulo="Pendentes"
    [ocupado]="ocupado()"
    [tarefas]="pendentes()"
    [quantidade]="pendentes().length"
    (visualizar)="visualizar($event)"
    (alterarStatus)="alterarStatus($event)"
    (editar)="editar($event)"
    (excluir)="excluir($event)"
  />
  <app-quadro-tarefas
    titulo="Concluídas"
    [ocupado]="ocupado()"
    [tarefas]="concluidas()"
    [quantidade]="concluidas().length"
    (visualizar)="visualizar($event)"
    (alterarStatus)="alterarStatus($event)"
    (editar)="editar($event)"
    (excluir)="excluir($event)"
  />
</main>
