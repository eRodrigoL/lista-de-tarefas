<div class="cabecalho" [formGroup]="formulario">
  <span mat-dialog-title>
    @if (dados?.tarefa) {
      {{ dados?.tarefa?.status === 'concluida' ? 'Concluída' : 'Pendente' }}
    } @else {
      Nova tarefa
    }
  </span>

  <mat-form-field class="prazo" subscriptSizing="dynamic">
    <mat-label>Prazo</mat-label>
    <input matInput type="date" formControlName="prazo" />
  </mat-form-field>
</div>
<mat-dialog-content>
  <form [formGroup]="formulario">
    <mat-form-field>
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="descricao" rows="3"></textarea>
    </mat-form-field>
    @if (!visualizando) {
      <mat-form-field>
        <mat-label>Prazo</mat-label>
        <input matInput type="date" formControlName="prazo" />
      </mat-form-field>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close [disabled]="salvando()">
    {{ visualizando ? 'Fechar' : 'Cancelar' }}
  </button>
  @if (!visualizando) {
    <button matButton [disabled]="formulario.invalid || salvando()" (click)="salvar()">
      Criar
    </button>
  }
</mat-dialog-actions>
