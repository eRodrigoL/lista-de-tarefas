<div class="cabecalho" [formGroup]="formulario">
  <div class="situacao" [class.concluida]="formulario.controls.status.value === 'concluida'">
    @if (dados?.tarefa) {
      <mat-slide-toggle
        [checked]="formulario.controls.status.value === 'concluida'"
        [disabled]="visualizando || salvando()"
        (change)="formulario.controls.status.setValue($event.checked ? 'concluida' : 'pendente')"
        aria-label="Alterar status da tarefa"
      ></mat-slide-toggle>
    }

    <span mat-dialog-title>
      @if (dados?.tarefa) {
        {{ formulario.controls.status.value === 'concluida' ? 'Concluída' : 'Pendente' }}
      } @else {
        Nova tarefa
      }
    </span>
  </div>

  <mat-form-field class="prazo" subscriptSizing="dynamic">
    <mat-label>Prazo</mat-label>
    <input matInput type="date" formControlName="prazo" />
  </mat-form-field>
</div>

<mat-dialog-content>
  <form [formGroup]="formulario">
    <mat-form-field>
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="descricao" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (visualizando) {
    <button mat-icon-button (click)="editar()" [disabled]="salvando()" aria-label="Editar tarefa">
      <mat-icon>edit</mat-icon>
    </button>
  }

  @if (dados?.tarefa) {
    <button
      mat-icon-button
      class="excluir"
      (click)="excluir()"
      [disabled]="salvando()"
      aria-label="Excluir tarefa"
    >
      <mat-icon>delete</mat-icon>
    </button>
  }

  @if (!visualizando) {
    <button
      mat-icon-button
      [disabled]="formulario.invalid || salvando()"
      (click)="salvar()"
      [attr.aria-label]="editando ? 'Salvar alterações' : 'Criar tarefa'"
    >
      <mat-icon>{{ editando ? 'save' : 'add' }}</mat-icon>
    </button>
  }

  <button
    mat-icon-button
    class="fechar"
    mat-dialog-close
    [disabled]="salvando()"
    aria-label="Fechar"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>
