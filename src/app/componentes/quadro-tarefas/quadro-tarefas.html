<div class="cabecalho">
  <h2>{{ titulo() }}</h2>
  <span>{{ quantidade() }}</span>
</div>

<div class="tarefas" tabindex="0">
  @for (tarefa of tarefas(); track tarefa.id) {
    <mat-card (click)="visualizar.emit(tarefa)">
      <div class="cabecalho-tarefa">
        <h3>{{ tarefa.titulo }}</h3>
        <span>Prazo: {{ tarefa.prazo | date: 'dd/MM/yyyy' }}</span>
      </div>

      <p>{{ tarefa.descricao | resumo }}</p>

      <div class="acoes" (click)="$event.stopPropagation()">
        <mat-slide-toggle
          [checked]="tarefa.status === 'concluida'"
          (change)="
            alterarStatus.emit(tarefa); $event.source.checked = tarefa.status === 'concluida'
          "
          [attr.aria-label]="'Alterar status de ' + tarefa.titulo"
        >
          {{ tarefa.status === 'concluida' ? 'Concluída' : 'Pendente' }}
        </mat-slide-toggle>
        <div>
          <button
            mat-icon-button
            (click)="editar.emit(tarefa)"
            [attr.aria-label]="'Editar ' + tarefa.titulo"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="excluir.emit(tarefa)"
            [attr.aria-label]="'Excluir ' + tarefa.titulo"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </mat-card>
  }
</div>
