<div class="cabecalho">
  <h2>{{ titulo() }}</h2>
  <span>{{ quantidade() }}</span>
</div>

<div class="tarefas" tabindex="0">
  @for (tarefa of tarefas(); track tarefa.id) {
    <mat-card (click)="visualizar.emit(tarefa)">
      <h3>{{ tarefa.titulo }}</h3>
      <p>{{ tarefa.descricao }}</p>
      <span>Prazo: {{ tarefa.prazo }} &middot; Status: {{ tarefa.status }}</span>
    </mat-card>
  }
</div>
