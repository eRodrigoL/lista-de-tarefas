<div class="cabecalho">
  <div class="titulo-quadro">
    <mat-icon class="icone-quadro" [fontIcon]="icone()" aria-hidden="true" />
    <h2>{{ titulo() }}</h2>
  </div>
  <span class="quantidade">{{ quantidade() }}</span>
</div>

<div
  class="tarefas"
  tabindex="0"
  cdkDropList
  cdkDropListOrientation="mixed"
  [cdkDropListData]="tarefas()"
  [cdkDropListDisabled]="ocupado()"
  (cdkDropListDropped)="reordenar($event)"
>
  @for (tarefa of tarefas(); track tarefa.id) {
    <mat-card cdkDrag [cdkDragData]="tarefa">
      <div
        class="conteudo"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Visualizar ' + tarefa.titulo"
        [attr.aria-disabled]="ocupado()"
        (click)="!ocupado() && visualizar.emit(tarefa)"
        (keydown.enter)="!ocupado() && visualizar.emit(tarefa)"
        (keydown.space)="$event.preventDefault(); !ocupado() && visualizar.emit(tarefa)"
      >
        <div class="cabecalho-tarefa">
          <h3>{{ tarefa.titulo }}</h3>
        </div>
        <app-texto-formatado class="resumo" [texto]="tarefa.descricao" [compacto]="true" />
      </div>

      <div class="acoes" (click)="$event.stopPropagation()">
        <div class="informacoes">
          <div class="situacao" [class.concluida]="tarefa.status === 'concluida'">
            <mat-slide-toggle
              [disabled]="ocupado()"
              [checked]="tarefa.status === 'concluida'"
              (change)="
                alterarStatus.emit(tarefa); $event.source.checked = tarefa.status === 'concluida'
              "
              [attr.aria-label]="'Alterar status de ' + tarefa.titulo"
            />
            <span>{{ tarefa.status === 'concluida' ? 'Concluída' : 'Pendente' }}</span>
          </div>

          <span class="prazo">
            <mat-icon aria-hidden="true">calendar_today</mat-icon>
            <span>
              <small>Prazo:</small>
              <strong>{{ tarefa.prazo | date: 'dd/MM/yyyy' }}</strong>
            </span>
          </span>
        </div>

        <div class="botoes">
          <button
            mat-icon-button
            cdkDragHandle
            [disabled]="ocupado()"
            aria-label="Reordenar tarefa: arraste ou use as setas para cima e para baixo"
            (keydown.arrowup)="$event.preventDefault(); mover($index, -1)"
            (keydown.arrowdown)="$event.preventDefault(); mover($index, 1)"
          >
            <mat-icon>drag_indicator</mat-icon>
          </button>
          <button
            mat-icon-button
            [disabled]="ocupado()"
            (click)="editar.emit(tarefa)"
            [attr.aria-label]="'Editar ' + tarefa.titulo"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            class="excluir"
            [disabled]="ocupado()"
            (click)="excluir.emit(tarefa)"
            [attr.aria-label]="'Excluir ' + tarefa.titulo"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </mat-card>
  } @empty {
    <div class="vazio">
      <mat-icon aria-hidden="true">inbox</mat-icon>
      <span>Nenhuma tarefa neste quadro.</span>
    </div>
  }
</div>
