<h2 mat-dialog-title>Excluir tarefa?</h2>
<mat-dialog-content>
  <p>A terafa "{{ titulo }}" será excluída</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton [mat-dialog-close]="false">Cancelar</button>
  <button matButton [mat-dialog-close]="true">Excluir</button>
</mat-dialog-actions>
